name: Update README
on:
  workflow_dispatch:
  push:
    branches: ["main"]
  pull_request:
  schedule:
    - cron: "*/30 * * * *"
concurrency:
  group: update-readme-${{ github.ref }}
  cancel-in-progress: true
permissions: {}
jobs:
  build:
    runs-on: ubuntu-26.04
    permissions:
      contents: write # commit the refreshed README
    name: Update this repo's README with recent activity
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: main
          persist-credentials: true
      - name: Clear previous activity
        if: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'}}
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("README.md")
          before, section = path.read_text().split("<!--START_SECTION:activity-->", 1)
          _, after = section.split("<!--END_SECTION:activity-->", 1)
          path.write_text(f"{before}<!--START_SECTION:activity-->\n<!--END_SECTION:activity-->{after}")
          PY
      - uses: jamesgeorge007/github-activity-readme@v0.5.0
        id: activity
        if: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'}}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          MAX_LINES: "10"
      - uses: astral-sh/setup-uv@v7.6.0
        if: steps.activity.outcome == 'success'
      - name: Format generated activity
        if: steps.activity.outcome == 'success'
        run: |
          git pull --ff-only origin main
          uvx --from mdformat --with mdformat-gfm --with mdformat-ruff mdformat --wrap 120 README.md
          python3 - <<'PY'
          import re
          from pathlib import Path

          content = Path("README.md").read_text()
          section = content.split("<!--START_SECTION:activity-->", 1)[1].split("<!--END_SECTION:activity-->", 1)[0]
          entries = sum(bool(re.match(r"^\d+\. ", line)) for line in section.splitlines())
          if entries > 10:
              raise SystemExit(f"Expected at most 10 activity entries, found {entries}")
          PY
          git add README.md
          if ! git diff --cached --quiet; then
            git -c user.name=github-actions[bot] -c user.email=41898282+github-actions[bot]@users.noreply.github.com commit -m '💄 style: format generated activity'
            git push origin HEAD:main
          fi
